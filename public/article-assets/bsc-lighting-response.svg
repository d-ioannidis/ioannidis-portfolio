<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Documented adaptive lighting rule examples</title>
  <desc id="desc">Bar chart showing selected thesis rule examples: zero people gives zero percent brightness, fewer than twenty people gives fifteen percent, more than fifty gives eighty percent, and two hundred or more gives one hundred percent.</desc>
  <rect width="1200" height="620" fill="#f2f0e9"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#101927">Adaptive-lighting rule examples</text>
  <text x="60" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#53606b">Selected WHEN-THEN rules documented for the Eleftherias Square prototype.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="135" y1="500" x2="1120" y2="500" stroke="#101927" stroke-width="2"/><line x1="135" y1="145" x2="135" y2="500" stroke="#101927" stroke-width="2"/>
    <g stroke="#c9c6bc" stroke-width="1"><line x1="135" y1="429" x2="1120" y2="429"/><line x1="135" y1="358" x2="1120" y2="358"/><line x1="135" y1="287" x2="1120" y2="287"/><line x1="135" y1="216" x2="1120" y2="216"/><line x1="135" y1="145" x2="1120" y2="145"/></g>
    <g fill="#6c7480" font-size="13"><text x="112" y="505" text-anchor="end">0%</text><text x="112" y="434" text-anchor="end">20%</text><text x="112" y="363" text-anchor="end">40%</text><text x="112" y="292" text-anchor="end">60%</text><text x="112" y="221" text-anchor="end">80%</text><text x="112" y="150" text-anchor="end">100%</text></g>
    <rect x="205" y="498" width="150" height="2" fill="#101927"/><text x="280" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#101927">0 people</text><text x="280" y="560" text-anchor="middle" font-size="13" fill="#53606b">lights off</text>
    <rect x="430" y="447" width="150" height="53" rx="4" fill="#d7ff43" stroke="#101927" stroke-width="1.5"/><text x="505" y="437" text-anchor="middle" font-size="18" font-weight="700" fill="#101927">15%</text><text x="505" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#101927">&lt; 20 people</text><text x="505" y="560" text-anchor="middle" font-size="13" fill="#53606b">reduced output</text>
    <rect x="655" y="216" width="150" height="284" rx="4" fill="#4057ff"/><text x="730" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#101927">80%</text><text x="730" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#101927">&gt; 50 people</text><text x="730" y="560" text-anchor="middle" font-size="13" fill="#53606b">higher activity</text>
    <rect x="880" y="145" width="150" height="355" rx="4" fill="#101927"/><text x="955" y="134" text-anchor="middle" font-size="18" font-weight="700" fill="#101927">100%</text><text x="955" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#101927">≥ 200 people</text><text x="955" y="560" text-anchor="middle" font-size="13" fill="#53606b">full brightness</text>
  </g>
  <text x="60" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6c7480">These are selected rule examples from the thesis, not a complete continuous mapping for every possible crowd size.</text>
</svg>