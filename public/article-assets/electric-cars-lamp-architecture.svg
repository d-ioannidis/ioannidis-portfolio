<text x="520" y="317" text-anchor="middle" font-size="12" fill="#fff">forms · auth · search</text>
<rect x="760" y="120" width="360" height="250" rx="10" fill="#fff" stroke="#101927" stroke-width="2"/>
<text x="940" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#101927">MySQL · electric_cars</text>
<rect x="800" y="200" width="90" height="90" rx="6" fill="#d7ff43" stroke="#101927"/>
<text x="845" y="238" text-anchor="middle" font-size="14" font-weight="700">user</text>
<text x="845" y="259" text-anchor="middle" font-size="11">accounts</text>
