<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Smart City prototype architecture</title>
  <desc id="desc">OpenWeatherMap sends weather data over HTTP and a Python client publishes device style data over MQTT into OpenRemote running in Docker on an Ubuntu VPS. OpenRemote assets and rules drive the simulated lighting scenario.</desc>
  <rect width="1200" height="720" fill="#f2f0e9"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#101927">Smart City prototype: integration architecture</text>
  <text x="60" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#53606b">Two ingestion patterns feed one OpenRemote deployment: HTTP pull and MQTT publish.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#101927"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="165" width="240" height="105" rx="8" fill="#ffffff" stroke="#101927" stroke-width="2"/>
    <text x="180" y="203" text-anchor="middle" font-size="18" font-weight="700" fill="#101927">OpenWeatherMap</text><text x="180" y="230" text-anchor="middle" font-size="14" fill="#53606b">Weather API</text><text x="180" y="252" text-anchor="middle" font-size="13" fill="#4057ff">HTTP · JSON</text>
    <rect x="60" y="395" width="240" height="105" rx="8" fill="#ffffff" stroke="#101927" stroke-width="2"/>
    <text x="180" y="433" text-anchor="middle" font-size="18" font-weight="700" fill="#101927">Python MQTT client</text><text x="180" y="460" text-anchor="middle" font-size="14" fill="#53606b">paho-mqtt prototype</text><text x="180" y="482" text-anchor="middle" font-size="13" fill="#4057ff">MQTT · TLS</text>
    <rect x="405" y="145" width="415" height="390" rx="10" fill="#101927"/>
    <text x="612.5" y="183" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Ubuntu VPS</text><text x="612.5" y="207" text-anchor="middle" font-size="13" fill="#d7ff43">Docker-hosted OpenRemote</text>
    <rect x="455" y="240" width="315" height="95" rx="7" fill="#d7ff43" stroke="#ffffff" stroke-width="2"/>
    <text x="612.5" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#101927">OpenRemote</text><text x="612.5" y="302" text-anchor="middle" font-size="14" fill="#303b47">Assets · agents · rules · insights</text>
    <rect x="455" y="375" width="145" height="95" rx="7" fill="#ffffff"/><text x="527.5" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#101927">Weather Asset</text><text x="527.5" y="438" text-anchor="middle" font-size="13" fill="#53606b">temp · humidity</text>
    <rect x="625" y="375" width="145" height="95" rx="7" fill="#ffffff"/><text x="697.5" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#101927">Device Assets</text><text x="697.5" y="438" text-anchor="middle" font-size="13" fill="#53606b">telemetry · state</text>
    <rect x="405" y="575" width="415" height="80" rx="8" fill="#ffffff" stroke="#101927" stroke-width="2"/><text x="612.5" y="607" text-anchor="middle" font-size="17" font-weight="700" fill="#101927">Cloudflare DNS + HTTPS/TLS</text><text x="612.5" y="633" text-anchor="middle" font-size="13" fill="#53606b">Public access layer for the hosted prototype</text>
    <rect x="915" y="250" width="225" height="210" rx="8" fill="#4057ff" stroke="#101927" stroke-width="2"/>
    <text x="1027.5" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Adaptive lighting</text><text x="1027.5" y="314" text-anchor="middle" font-size="13" fill="#ffffff">Eleftherias Square</text>
    <circle cx="1027.5" cy="355" r="25" fill="#d7ff43" stroke="#101927" stroke-width="2"/><text x="1027.5" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#101927">COUNT</text>
    <g fill="#ffffff" stroke="#101927" stroke-width="2"><circle cx="970" cy="405" r="16"/><circle cx="1008" cy="420" r="16"/><circle cx="1047" cy="420" r="16"/><circle cx="1085" cy="405" r="16"/></g>
    <text x="1027.5" y="448" text-anchor="middle" font-size="13" fill="#ffffff">1 people counter · 4 lights</text>
  </g>
  <g fill="none" stroke="#101927" stroke-width="3" marker-end="url(#arrow)">
    <path d="M300 217 H410 Q430 217 450 252"/><path d="M300 447 H410 Q430 447 450 317"/><path d="M612 335 V375"/><path d="M770 287 H870 Q895 287 915 320"/><path d="M820 615 H895 Q915 615 915 460"/>
  </g>
  <text x="322" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4057ff">pull</text>
  <text x="322" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4057ff">publish</text>
</svg>