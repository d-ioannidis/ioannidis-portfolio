<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Electric vehicle data explorer architecture</title>
<desc id="desc">A browser connects to an Apache virtual host running PHP. PHP queries a MySQL database containing user, models, and contact tables, and sends test mail through Postfix to MailHog.</desc>
<rect width="1200" height="650" fill="#f2f0e9"/>
<text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#101927">Electric Vehicle Data Explorer</text>
<text x="60" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#53606b">University project architecture · LAMP stack + local SMTP testing</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#101927"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="70" y="210" width="210" height="110" rx="8" fill="#fff" stroke="#101927" stroke-width="2"/>
<text x="175" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#101927">Browser</text>
<text x="175" y="279" text-anchor="middle" font-size="14" fill="#53606b">HTML · CSS · Bootstrap</text>
<rect x="370" y="160" width="300" height="210" rx="10" fill="#101927"/>
<text x="520" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Apache + PHP</text>
<text x="520" y="232" text-anchor="middle" font-size="14" fill="#d7ff43">electric-cars.local</text>
<rect x="420" y="270" width="200" height="62" rx="6" fill="#4057ff"/>
